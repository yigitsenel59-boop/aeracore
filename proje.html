<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Area Core</title>
    <style>
        :root {
            --bg: #26501d;
            --bg-soft: hsl(14, 72%, 42%);
            --panel: rgba(213, 113, 31, 0.78);
            --card: #111827;
            --line: rgba(148, 163, 184, 0.2);
            --text: #ffffff;
            --text-soft: #f3f4f6;
            --muted: #ef4444;
            --primary: #dc2626;
            --accent: #2563eb;
            --shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
        }

        h1 {
            color: var(--text);
        }

        a {
            color: var(--accent);
        }
    </style>

            






           
          
        
    </style>
</head>
<body>
    <h1>Proje Tanıtım</h1>
    <p>Bu sayfa, projenizi tanıtacağınız bir alan olacak.</p>
    <a href="index.html">Ana Sayfa</a>
</body>
</html>
